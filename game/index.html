<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIGHTVAULT — a top-down stealth heist</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0f1a;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  canvas {
    display: block;
    background: #e8e4d8;
    box-shadow: 0 0 60px rgba(255, 210, 63, 0.12);
  }
  noscript p {
    color: #fff;
    text-align: center;
    max-width: 40em;
    padding: 2em;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="684"></canvas>
<noscript><p>NIGHTVAULT needs JavaScript: move with WASD or the arrow keys,
or click to walk. Steal the gem, reach the green exit, stay out of the
yellow vision cones.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
